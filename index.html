<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>おまかせゲーセン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one full-viewport cabinet; a single 3:4 game screen letterboxed in the middle. Deliberately one dark "midnight carnival" look. */
:root{
  --ink:#120e1d; --ink2:#221a38; --cream:#fff3df; --coral:#ff6f59; --gold:#ffc857; --teal:#2ec4b6;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 35%,var(--ink2),var(--ink) 70%);background-color:var(--ink);color:var(--cream);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:10px;box-sizing:border-box}
#cv{display:block;border-radius:16px;box-shadow:0 0 0 2px rgba(255,200,87,.35),0 20px 60px rgba(0,0,0,.6);touch-action:none;outline:none}
#cv:focus-visible{box-shadow:0 0 0 3px var(--teal),0 20px 60px rgba(0,0,0,.6)}
#stage{touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
@media (prefers-reduced-motion:reduce){#cv{box-shadow:0 0 0 2px rgba(255,200,87,.35)}}
</style>
<div id="stage"><canvas id="cv" tabindex="0" aria-label="ミニゲームのプレイ画面。タップかスペースキーで進む"></canvas></div>
<script src="engine.js"></script>
<script src="pack1.js"></script>
<script src="pack2.js"></script>
<script src="pack3.js"></script>
<script src="pack4.js"></script>
<script src="pack5.js"></script>
<script src="pack6.js"></script>
<script src="pack7.js"></script>
<script src="pack8.js"></script>
<script>MG.start()</script>

</body></html>
